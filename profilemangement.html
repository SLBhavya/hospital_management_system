<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Management</title>
    <style>
        /* Reset some default styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('userpagepic.webp'); /* Ensure this image has a subtle pattern */
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
        }

        /* Overlay to make the background image less distracting */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 600px;
            width: 90%;
            padding: 30px 40px;
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            animation: fadeIn 1s ease-in-out;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 2em;
            position: relative;
        }

        /* Decorative underline */
        h2::after {
            content: '';
            display: block;
            width: 50px;
            height: 3px;
            background-color: #007bff;
            margin: 10px auto 0;
            border-radius: 2px;
        }

        .profile-details p {
            margin: 15px 0;
            font-size: 1.1em;
            color: #555;
            transition: color 0.3s ease;
        }

        .profile-details p strong {
            color: #333;
        }

        .profile-details p:hover {
            color: #007bff;
        }

        .edit-btn, .submit-btn {
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            cursor: pointer;
            border-radius: 30px;
            font-size: 1em;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-top: 15px;
        }

        .edit-btn:hover, .submit-btn:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        .edit-form {
            display: none;
            margin-top: 20px;
            animation: slideDown 0.5s ease forwards;
        }

        .edit-form.show {
            display: block;
        }

        .edit-form h3 {
            margin-bottom: 15px;
            color: #333;
            text-align: center;
            font-size: 1.5em;
        }

        .edit-form label {
            display: block;
            margin: 10px 0 5px;
            color: #333;
            font-weight: bold;
        }

        .edit-form input, .edit-form select {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            font-size: 1em;
        }

        .edit-form input:focus, .edit-form select:focus {
            border-color: #007bff;
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.2);
            outline: none;
        }

        /* Keyframes for animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideDown {
            from { opacity: 0; max-height: 0; }
            to { opacity: 1; max-height: 1000px; }
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .container {
                padding: 20px 25px;
            }

            h2 {
                font-size: 1.8em;
            }

            .edit-btn, .submit-btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }

            .edit-form h3 {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Profile Management</h2>
    <div class="profile-details" id="profileDetails">
        <p><strong>Name:</strong> <span id="nameDisplay">Dr. John Doe</span></p>
        <p><strong>Department:</strong> <span id="departmentDisplay">Cardiology</span></p>
        <p><strong>Role:</strong> <span id="roleDisplay">Senior Consultant</span></p>
        <p><strong>Phone:</strong> <span id="phoneDisplay">+1-234-567-890</span></p>
        <p><strong>Email:</strong> <span id="emailDisplay">johndoe@hospital.com</span></p>
        <button class="edit-btn" onclick="toggleEditForm()">Edit Profile</button>
    </div>

    <div class="edit-form" id="editForm">
        <h3>Edit Profile</h3>
        <form id="editProfileForm">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" value="Dr. John Doe" required>

            <label for="department">Department:</label>
            <select id="department" name="department" required>
                <option value="Cardiology">Cardiology</option>
                <option value="Neurology">Neurology</option>
                <option value="Orthopedics">Orthopedics</option>
                <option value="Radiology">Radiology</option>
                <!-- Add more departments as needed -->
            </select>

            <label for="role">Role:</label>
            <input type="text" id="role" name="role" value="Senior Consultant" required>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" value="+1-234-567-890" pattern="[+]{1}[0-9-]{9,15}" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="johndoe@hospital.com" required>

            <button type="button" class="submit-btn" onclick="submitForm()">Save Changes</button>
        </form>
    </div>
</div>

<script>
    function toggleEditForm() {
        const form = document.getElementById('editForm');
        const profileDetails = document.getElementById('profileDetails');
        if (form.classList.contains('show')) {
            form.classList.remove('show');
            profileDetails.style.display = 'block';
        } else {
            form.classList.add('show');
            profileDetails.style.display = 'none';
        }
    }

    async function submitForm() {
        const id = 'someUserId'; // Replace with actual user ID
        const form = document.getElementById('editProfileForm');
        const formData = new FormData(form);

        const userData = {
            name: formData.get('name'),
            department: formData.get('department'),
            role: formData.get('role'),
            phone: formData.get('phone'),
            email: formData.get('email')
        };

        try {
            const response = await fetch(`/user/update/${id}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(userData),
            });

            const result = await response.json();
            if (response.ok) {
                document.getElementById('nameDisplay').innerText = result.name;
                document.getElementById('departmentDisplay').innerText = result.department;
                document.getElementById('roleDisplay').innerText = result.role;
                document.getElementById('phoneDisplay').innerText = result.phone;
                document.getElementById('emailDisplay').innerText = result.email;

                toggleEditForm();
                alert('Profile updated successfully!');
            } else {
                alert('Error updating profile: ' + result.message);
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An unexpected error occurred. Please try again later.');
        }
    }

    // Optional: Close the edit form when clicking outside the container
    window.onclick = function(event) {
        const container = document.querySelector('.container');
        const form = document.getElementById('editForm');
        if (!container.contains(event.target) && form.classList.contains('show')) {
            toggleEditForm();
        }
    }
</script>

</body>
</html>
