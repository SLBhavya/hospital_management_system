<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - Hospital Management</title>
    <style>
        /* Reset some default styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('userpagepic.webp'); /* Ensure this image has a subtle pattern */
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
        }

        /* Overlay to make the background image less distracting */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 800px;
            width: 90%;
            padding: 30px 40px;
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            animation: fadeIn 1s ease-in-out;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 2em;
            position: relative;
        }

        /* Decorative underline */
        h2::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background-color: #007bff;
            margin: 10px auto 0;
            border-radius: 2px;
        }

        .appointments-section, .new-appointment-form {
            margin-bottom: 30px;
        }

        .appointments-section h3, .new-appointment-form h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.5em;
            position: relative;
        }

        /* Decorative underline for subheadings */
        .appointments-section h3::after, .new-appointment-form h3::after {
            content: '';
            display: block;
            width: 40px;
            height: 3px;
            background-color: #007bff;
            margin: 5px auto 0;
            border-radius: 2px;
        }

        .appointments-list {
            margin: 20px 0;
            max-height: 300px;
            overflow-y: auto;
            transition: max-height 0.5s ease;
        }

        .appointment-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            background-color: #fafafa;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .appointment-item:hover {
            background-color: #e9f5ff;
            transform: translateY(-2px);
        }

        .appointment-item p {
            margin: 0;
            color: #555;
            font-size: 1em;
        }

        .cancel-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .cancel-btn:hover {
            background-color: #c82333;
            transform: scale(1.05);
        }

        .new-appointment-form form {
            display: flex;
            flex-direction: column;
        }

        .new-appointment-form label {
            margin: 10px 0 5px;
            color: #333;
            font-weight: bold;
        }

        .new-appointment-form input, 
        .new-appointment-form select {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            font-size: 1em;
        }

        .new-appointment-form input:focus, 
        .new-appointment-form select:focus {
            border-color: #007bff;
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.2);
            outline: none;
        }

        .submit-btn {
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            cursor: pointer;
            border-radius: 30px;
            font-size: 1em;
            align-self: flex-end;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        /* Scrollbar styling */
        .appointments-list::-webkit-scrollbar {
            width: 8px;
        }

        .appointments-list::-webkit-scrollbar-thumb {
            background-color: #ccc;
            border-radius: 4px;
        }

        .appointments-list::-webkit-scrollbar-thumb:hover {
            background-color: #b3b3b3;
        }

        /* Keyframes for animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .container {
                padding: 20px 25px;
            }

            h2 {
                font-size: 1.8em;
            }

            .appointments-section h3, .new-appointment-form h3 {
                font-size: 1.3em;
            }

            .appointment-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .cancel-btn {
                margin-top: 10px;
            }

            .submit-btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Manage Appointments</h2>
    
    <!-- View Appointments Section -->
    <div class="appointments-section">
        <h3>Upcoming Appointments</h3>
        <div class="appointments-list" id="appointmentsList">
            <!-- Appointments will be dynamically added here -->
        </div>
    </div>

    <!-- Schedule New Appointment Form -->
    <div class="new-appointment-form">
        <h3>Schedule New Appointment</h3>
        <form id="newAppointmentForm">
            <label for="date">Appointment Date:</label>
            <input type="date" id="date" name="date" required>

            <label for="time">Appointment Time:</label>
            <input type="time" id="time" name="time" required>

            <label for="doctor">Select Doctor:</label>
            <select id="doctor" name="doctor" required>
                <option value="">Select a doctor</option>
                <option value="Dr. John Doe (Cardiology)">Dr. John Doe (Cardiology)</option>
                <option value="Dr. Jane Smith (Neurology)">Dr. Jane Smith (Neurology)</option>
                <option value="Dr. Mark Lee (Orthopedics)">Dr. Mark Lee (Orthopedics)</option>
                <option value="Dr. Sara Green (Radiology)">Dr. Sara Green (Radiology)</option>
                <!-- Add more doctors as needed -->
            </select>

            <button type="button" class="submit-btn" onclick="scheduleAppointment()">Schedule Appointment</button>
        </form>
    </div>
</div>

<script>
// Sample data for existing appointments (in a real app, fetch from the server)
let appointments = [
    { id: 1, date: '2024-10-10', time: '10:00 AM', doctor: 'Dr. John Doe (Cardiology)' },
    { id: 2, date: '2024-10-15', time: '02:00 PM', doctor: 'Dr. Jane Smith (Neurology)' }
];

// Function to render appointments on the page
function renderAppointments() {
    const appointmentsList = document.getElementById('appointmentsList');
    appointmentsList.innerHTML = '';

    if (appointments.length === 0) {
        appointmentsList.innerHTML = '<p>No upcoming appointments.</p>';
        return;
    }

    appointments.forEach((appointment) => {
        const appointmentItem = document.createElement('div');
        appointmentItem.className = 'appointment-item';
        appointmentItem.innerHTML = `
            <p><strong>${appointment.date}</strong> at <strong>${appointment.time}</strong> with <strong>${appointment.doctor}</strong></p>
            <button class="cancel-btn" onclick="cancelAppointment(${appointment.id})">Cancel</button>
        `;
        appointmentsList.appendChild(appointmentItem);
    });
}

// Function to schedule a new appointment
function scheduleAppointment() {
    const date = document.getElementById('date').value;
    const time = document.getElementById('time').value;
    const doctor = document.getElementById('doctor').value;

    if (!date || !time || !doctor) {
        alert('Please fill out all fields.');
        return;
    }

    const newAppointment = {
        id: appointments.length ? appointments[appointments.length - 1].id + 1 : 1,
        date,
        time,
        doctor
    };

    appointments.push(newAppointment);
    renderAppointments();
    alert('Appointment scheduled successfully.');
    document.getElementById('newAppointmentForm').reset();
}

// Function to cancel an appointment
function cancelAppointment(id) {
    if (!confirm('Are you sure you want to cancel this appointment?')) return;

    appointments = appointments.filter(appointment => appointment.id !== id);
    renderAppointments();
    alert('Appointment canceled successfully.');
}

// Initial render of appointments
document.addEventListener('DOMContentLoaded', renderAppointments);
</script>

</body>
</html>
