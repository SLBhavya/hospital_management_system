<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oncology</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
        }

        th {
            background-color: #f4f4f4;
        }

        header {
            margin-bottom: 20px;
        }
        .doctor-img {
            width: 80px; /* Reduced size */
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .doctor-info {
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>Oncology</h1>
    </header>

    <section>
        <table>
            <thead>
                <tr>
                    <th>Doctor</th>
                    <th>photo</th>
                    <th>Qualifications</th>
                    <th>Available Time</th>
                </tr>
            </thead>
            <tbody>
              <tr>
                <td class="doctor-info">Dr. James</td>
                <td><img src="doctor5.jpg" alt="Dr. James" class="doctor-img"></td>
                <td>MBBS, MD (oncologist)</td>
                <td>9:00 AM - 1:00 PM</td>
            </tr>
            <tr>
                <td class="doctor-info">Dr. Sophia</td>
                <td><img src="doctor6.jpg" alt="Dr. Sophia" class="doctor-img"></td>
                <td>MBBS, MD (oncologist)</td>
                <td>2:00 PM - 6:00 PM</td>
            </tr>
            <tr>
                <td class="doctor-info">Dr. Michael</td>
                <td><img src="doctor7.png" alt="Dr. Michael" class="doctor-img"></td>
                <td>MBBS, MD (oncologist)</td>
                <td>8:00 AM - 12:00 PM</td>
            </tr>
            <tr>
              <td class="doctor-info">Dr. Michael</td>
              <td><img src="doctor8.png" alt="Dr. Michael" class="doctor-img"></td>
              <td>MBBS, MD (oncologist)</td>
              <td>1:00 AM - 5:00 PM</td>
          </tr>
            </tbody>
        </table>
    </section>
</body>
</html>
