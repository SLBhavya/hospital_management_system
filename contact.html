<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head> 
<body>
    <style>
    /* General styles */
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f4f4f4;
}

/* Header styles */
header {
  background-color: #89cfdb;
  padding: 20px;
  text-align: center;
  color: #171717;
}

header h1 {
  margin: 0;
  font-size: 36px;
  color:#171717;
}

/* Section styles */
section {
  margin: 20px;
  padding: 20px;
  background-color: #89cfdb;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

/* Paragraph styles */
section p {
  font-size: 18px;
  color: #333;
  line-height: 1.6;
}

/* Contact info styling */
section p:nth-child(2), 
section p:nth-child(3), 
section p:nth-child(4) {
  font-weight: bold;
}

/* Address fix */
section p:nth-child(4) {
  text-transform: capitalize;
}
</style>
    <header>
        <h1>Contact Us</h1>
    </header>
    <section>
        <p>Reach out to us at:</p>
        <p>Phone: +123 456 7890</p>
        <p>Email: info@hospital.com</p>
        <p> adress:D/no : 38-3-2, Opp: RADIO STATION, Vijayawada Rd, beside NEXA SHOWROOM, Vijayawada, Andhra Pradesh 520010</p>
        
    </section>
</body>
</html>
